<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Two states are enough</title>
    <script>
      ;(() => {
        const saved = localStorage.getItem('dark-mode-toggle-demo')
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      })()
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="demo" data-demo>
      <p class="eyebrow">A dark-mode toggle</p>
      <h1>Two states are enough.</h1>
      <p class="intro">Change the page when it is uncomfortable; otherwise, let the system decide.</p>

      <div class="toggle-controls">
        <button class="toggle toggle--desktop" type="button" data-toggle>
          <span aria-hidden="true" data-icon>☾</span>
          <span data-action>Switch to dark</span>
        </button>
        <button class="toggle toggle--mobile" type="button" data-toggle>
          <span aria-hidden="true" data-icon>☾</span>
          <span class="visually-hidden" data-action>Switch to dark</span>
        </button>
      </div>
      <p class="status" aria-live="polite" data-status></p>

      <p class="home"><a href="https://github.com/clyons/dark-mode-toggle-til">View the project on GitHub</a> · <a href="https://ciaranlyons.com/til/2026/09/07/two-state-dark-mode-toggles">Read the TIL</a></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
